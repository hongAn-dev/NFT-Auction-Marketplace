syntax = "proto3";

package bidding;

option go_package = "bidding-service/proto;bidding";

service BiddingService {
  rpc PlaceBid (PlaceBidRequest) returns (PlaceBidResponse);
  rpc GetHighestBid (GetHighestBidRequest) returns (GetHighestBidResponse);
  // Người thắng xác nhận đã nhận hàng (docs/23 §6.1). user_id do api-gateway lấy
  // từ JWT, không lấy từ body.
  rpc ConfirmReceived (ConfirmReceivedRequest) returns (ConfirmReceivedResponse);
}

message Bid {
  string id = 1;
  string nft_id = 2;
  string user_id = 3;
  double amount = 4;
  int64 created_at = 5;
}

message PlaceBidRequest {
  string nft_id = 1;
  string user_id = 2;
  double amount = 3;
}

message PlaceBidResponse {
  bool success = 1;
  Bid bid = 2;
  string message = 3;
}

message GetHighestBidRequest {
  string nft_id = 1;
}

message GetHighestBidResponse {
  bool success = 1;
  Bid highest_bid = 2;
}

message ConfirmReceivedRequest {
  string nft_id = 1;
  string user_id = 2;
}

message ConfirmReceivedResponse {
  bool success = 1;
  string message = 2;
  string state = 3; // trạng thái saga sau khi xác nhận
}
