user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Định nghĩa danh sách các server api-gateway để load balance
    upstream api_gateway_upstream {
        # Dùng tên container và port nội bộ trong docker network
        server api-gateway:4000;
    }

    server {
        listen 80;
        server_name localhost;

        # Cấu hình log riêng cho gateway
        access_log /var/log/nginx/gateway_access.log main;
        error_log /var/log/nginx/gateway_error.log warn;

        # Chuyển hướng các request thường (REST HTTP)
        location / {
            proxy_pass http://api_gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Chuyển hướng WebSockets (Socket.IO)
        location /socket.io/ {
            proxy_pass http://api_gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Thời gian timeout dài hơn cho kết nối WebSocket lâu dài
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }
}
